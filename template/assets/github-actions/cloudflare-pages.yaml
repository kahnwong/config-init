name: Deploy to Cloudflare Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT_NAME: project # CHANGE ME
  BUILD_DIR: dist # CHANGE ME
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # ---------- install binary via nix ----------
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        id: zola-cache
        with:
          primary-key: nix-${{ runner.os }}-zola-v0.21.0
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install zola
        run: nix profile add nixpkgs#zola
      - name: Build zola
        run: zola build
      # ---------- install binary via mise ----------
      - name: Install zola
        uses: jdx/mise-action@v5
        with:
          tool_versions: |
            zola latest
      # ---------- build ----------
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "yarn"
      - name: Install requirements
        run: yarn install
      - name: Build
        run: yarn build
      # ---------- publish ----------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_DIR }} --project-name=${{ env.PROJECT_NAME }}
      # ---------- healthcheck ----------
      - name: Install ci-cd-utils
        uses: supplypike/setup-bin@v5
        with:
          uri: https://github.com/kahnwong/ci-cd-utils/releases/download/v0.1.0/ci-cd-utils_0.1.0_linux_amd64.tar.gz
          name: ci-cd-utils
          version: 0.1.0
      - name: Healthcheck
        run: |
          ci-cd-utils healthcheck https://example.com # CHANGE ME
