name: Python Test
on:
  pull_request:
    paths-ignore:
      - ".github/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - name: Run tests
        run: |
          uv run docker_mlflow/experiment_tracking.py
